name: Auto-Release on Tag Push

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Get tag/version
        id: tag
        shell: powershell
        run: |
          $tag = "${env:GITHUB_REF}".Replace("refs/tags/", "")
          $version = $tag.TrimStart('v','V')
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer artifacts
        shell: powershell
        run: .\Build-Installer.ps1 -Version ${{ steps.tag.outputs.VERSION }}

      - name: Sign installer (optional)
        shell: powershell
        env:
          CODE_SIGN_CERT_BASE64: ${{ secrets.CODE_SIGN_CERT_BASE64 }}
          CODE_SIGN_CERT_PASSWORD: ${{ secrets.CODE_SIGN_CERT_PASSWORD }}
          CODE_SIGN_TIMESTAMP_URL: ${{ secrets.CODE_SIGN_TIMESTAMP_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT_PASSWORD)) {
            Write-Host "Kein Zertifikat hinterlegt - Signierung wird übersprungen."
            exit 0
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CODE_SIGN_CERT_BASE64))

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            $signtool = "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\signtool.exe"
          }

          if (-not (Test-Path $signtool)) {
            throw "signtool.exe nicht gefunden."
          }

          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:CODE_SIGN_TIMESTAMP_URL }
          & $signtool sign /fd SHA256 /f $pfxPath /p $env:CODE_SIGN_CERT_PASSWORD /tr $timestampUrl /td SHA256 "installer/ReifeManager_Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signierung fehlgeschlagen." }

      - name: Verify artifacts
        shell: powershell
        run: |
          Get-ChildItem installer
          Test-Path "installer/ReifeManager_Setup.exe"
          Test-Path "installer/ReifeManager_Portable.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }} - Auto-Release
          body: |
            ## Auto-Release ${{ steps.tag.outputs.TAG }}

            Automatisch erstellt bei Tag-Push

            ### Downloads
            - Setup Installer: ReifeManager_Setup.exe
            - Portable ZIP: ReifeManager_Portable.zip
          files: |
            installer/ReifeManager_Setup.exe
            installer/ReifeManager_Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
